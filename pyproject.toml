[project]
name = "okbot"
version = "0.1.0"
description = "The best discord bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[project.scripts]
okbot = "okbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    .git
  | .hg
  | .mypy_cache
  | .tox
  | venv
  | _build
  | buck-out
  | build
  | dist
  | .pytest
)/
'''

[tool.uv]
package = false

[tool.flake8]
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "discord-py-stubs>=1.6.0.2",
    "flake8>=7.4.1",
    "pytest>=9.1.1",
]
